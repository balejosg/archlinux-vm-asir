services:
  # Servidor Web a auditar energéticamente
  web-servidor:
    image: nginx:alpine
    container_name: eco-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./sitio_demo:/usr/share/nginx/html:ro
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Sistema de recolección de métricas
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: eco-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitor_net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  monitor_net:
    driver: bridge

volumes:
  prometheus_data:
